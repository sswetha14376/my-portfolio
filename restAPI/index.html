<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store & Application</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS Reset & Global Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Header Navigation */
        header {
            background: #1c2541;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .logo span {
            color: #4cc9f0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-source {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #4cc9f0;
            color: #0b132b;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .btn-source:hover {
            background: #38b6db;
        }

        .cart-icon-btn {
            position: relative;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #4cc9f0;
            color: #0b132b;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Container Layout */
        .container {
            padding: 40px 8%;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .section-title span {
            color: #4cc9f0;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #1c2541;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .product-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #4cc9f0;
            margin-bottom: 15px;
        }

        .add-cart-btn {
            background: #4cc9f0;
            color: #0b132b;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s ease;
        }

        .add-cart-btn:hover {
            background: #3aaccf;
        }

        /* Sliding Cart Drawer */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 360px;
            height: 100%;
            background: #1c2541;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            padding: 25px;
            transition: right 0.3s ease;
            z-index: 101;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #ffffff;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .checkout-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header>
        <div class="logo">Shop<span>Ease</span></div>
        <div class="header-actions">
            <!-- Source Code meedha click chesthey GitHub/External URL ki elthundi -->
            <a href="https://github.com/sswetha14376/Ecommerce-App" target="_blank" class="btn-source">
                <i class="fab fa-github"></i> Source Code
            </a>
            
            <button class="cart-icon-btn" id="openCart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h2 class="section-title">Featured <span>Products</span></h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Sliding Shopping Cart Drawer -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Shopping Cart</h3>
            <button class="close-btn" id="closeCart">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <h4>Total: ₹<span id="cartTotal">0</span></h4>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Interactive JavaScript Logic -->
    <script>
        const products = [
            { id: 1, name: "Wireless Headphones", price: 2999, img: "https://via.placeholder.com/200" },
            { id: 2, name: "Smart Watch", price: 4499, img: "https://via.placeholder.com/200" },
            { id: 3, name: "Gaming Mouse", price: 1299, img: "https://via.placeholder.com/200" },
            { id: 4, name: "Mechanical Keyboard", price: 3499, img: "https://via.placeholder.com/200" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <div class="price">₹${p.price}</div>
                    <button class="add-cart-btn" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const itemsContainer = document.getElementById('cartItems');
            itemsContainer.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong>
                        <div>₹${item.price}</div>
                    </div>
                    <button onclick="removeFromCart(${index})" style="color:#ef4444; background:none; border:none; cursor:pointer; font-weight:bold;">Remove</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            alert("Order placed successfully!");
            cart = [];
            updateCart();
            document.getElementById('cartSidebar').classList.remove('open');
        }

        // Cart Drawer Toggles
        document.getElementById('openCart').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.add('open');
        });

        document.getElementById('closeCart').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.remove('open');
        });

        renderProducts();
    </script>
</body>
</html>
