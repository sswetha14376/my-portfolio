<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyBank Cards</title>

<link rel="stylesheet" href="cards.css">

</head>


<body>



<header>

<h1>
💳 MyBank Cards
</h1>

</header>







<section class="cards-section">



<h2>
Choose Your Card
</h2>





<div class="card-container">






<!-- Debit Card -->


<div class="bank-card">


<img src="images/photo-1556742049-0cfed4f6a45d.jpg">


<h3>
Debit Card
</h3>



<p>
Secure payments with your MyBank Debit Card.
</p>



<button onclick="applyCard('Debit Card')">

Apply Now

</button>




<button onclick="blockCard()">

Block Card

</button>



</div>









<!-- Credit Card -->


<div class="bank-card">


<img src="images/photo-1554224154-26032ffc0d07.jpg">


<h3>
Credit Card
</h3>



<p>
Enjoy rewards and flexible payments.
</p>



<button onclick="applyCard('Credit Card')">

Apply Now

</button>




<button onclick="blockCard()">

Block Card

</button>



</div>






</div>


</section>









<section class="card-details">



<h2>
My Card Details
</h2>




<div id="cardInfo">


<p>
No Card Applied
</p>


</div>




</section>







<script src="cards.js"></script>


</body>

</html>
