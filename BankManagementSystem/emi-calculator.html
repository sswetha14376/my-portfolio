<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Calculator - MyBank</title>

<link rel="stylesheet" href="emi.css">

</head>


<body>




<div class="emi-container">



<h1>
🏦 MyBank EMI Calculator
</h1>




<form id="emiForm">



<input

type="number"

id="loanAmount"

placeholder="Loan Amount"

required>




<input

type="number"

id="interestRate"

placeholder="Interest Rate (%)"

required>




<input

type="number"

id="loanYears"

placeholder="Loan Duration (Years)"

required>





<button type="submit">

Calculate EMI

</button>




</form>







<div class="result">



<h2>
EMI Details
</h2>




<p>
Monthly EMI:
<span id="emiAmount">
$0
</span>
</p>





<p>
Total Payment:
<span id="totalPayment">
$0
</span>
</p>






<p>
Total Interest:
<span id="totalInterest">
$0
</span>
</p>





</div>






<a href="dashboard.html">

Back To Dashboard

</a>



</div>






<script src="emi.js"></script>


</body>

</html>
