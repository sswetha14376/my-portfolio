<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - MyBank</title>

<link rel="stylesheet" href="contact.css">

</head>


<body>



<header>

<h1>
🏦 MyBank Contact Us
</h1>


</header>





<section class="contact-container">



<div class="contact-box">



<h2>
Get In Touch
</h2>



<p>
📍 Address: Bangalore, Karnataka
</p>


<p>
📞 Phone: +91 9876543210
</p>


<p>
📧 Email: support@mybank.com
</p>



</div>







<div class="form-box">


<h2>
Send Message
</h2>



<form id="contactForm">



<input

type="text"

id="name"

placeholder="Your Name"

required>





<input

type="email"

id="email"

placeholder="Your Email"

required>






<textarea

id="message"

placeholder="Your Message"

required>

</textarea>







<button type="submit">

Send Message

</button>




</form>




<h3 id="response"></h3>



</div>



</section>







<a href="dashboard.html">

<button class="back">

Back To Dashboard

</button>

</a>






<script src="contact.js"></script>


</body>

</html>
