<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - MyBank</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>





<!-- Sidebar -->


<div class="sidebar">


<h2>
🏦 MyBank Admin
</h2>




<ul>


<li>
Dashboard
</li>


<li>
Customers
</li>


<li>
Accounts
</li>


<li>
Transactions
</li>


<li>
Logout
</li>


</ul>



</div>







<!-- Main Content -->


<div class="main">



<h1>
Admin Dashboard
</h1>






<!-- Statistics -->


<div class="stats">





<div class="box">


<h3>
Total Customers
</h3>


<h2 id="customers">
0
</h2>


</div>








<div class="box">


<h3>
Total Accounts
</h3>


<h2 id="accounts">
0
</h2>


</div>








<div class="box">


<h3>
Total Balance
</h3>


<h2 id="balance">
$0
</h2>


</div>








<div class="box">


<h3>
Transactions
</h3>


<h2 id="transactions">
0
</h2>


</div>






</div>









<!-- Customer Table -->


<h2 class="title">
Customer Details
</h2>





<table>



<thead>


<tr>


<th>
Name
</th>


<th>
Email
</th>


<th>
Account Number
</th>


<th>
Balance
</th>



</tr>


</thead>





<tbody id="customerTable">



</tbody>





</table>






</div>







<script src="admin.js"></script>


</body>

</html>
