<!-- Contact Header -->


<section class="contact-home">


<h1>
Contact Us
</h1>


<p>
Get in touch with BookEase support team.
</p>


</section>









<!-- Contact Form -->


<section class="booking-section">


<div class="booking-box">


<form id="contactForm">



<div class="input-group">


<label>
Full Name
</label>


<input type="text"
id="contactName"
placeholder="Enter your name"
required>


</div>







<div class="input-group">


<label>
Email
</label>


<input type="email"
id="contactEmail"
placeholder="Enter your email"
required>


</div>







<div class="input-group">


<label>
Phone Number
</label>


<input type="tel"
id="contactPhone"
placeholder="Enter phone number">


</div>







<div class="input-group">


<label>
Message
</label>


<textarea 
id="contactMessage"
rows="5"
placeholder="Enter your message"
required></textarea>


</div>







<button type="submit" class="btn">

Send Message

</button>



</form>


</div>


</section>









<!-- Contact Information -->


<section class="services">


<h1>
Contact Information
</h1>



<div class="service-container">



<div class="card">


<h3>
Email
</h3>


<p>
support@bookease.com
</p>


</div>







<div class="card">


<h3>
Phone
</h3>


<p>
+91 98765 43210
</p>


</div>







<div class="card">


<h3>
Location
</h3>


<p>
Bangalore, India
</p>


</div>



</div>


</section>
