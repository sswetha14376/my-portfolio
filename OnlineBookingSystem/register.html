<body>


<!-- Navbar -->

<header>

<nav class="navbar">


<div class="logo">

<img src="img/logo.png">

</div>

</ul>


</nav>

</header>








<!-- Register Header -->


<section class="contact-home">


<h1>
Create Account
</h1>


<p>
Register to book and manage your services.
</p>


</section>









<!-- Register Form -->


<section class="booking-section">


<div class="booking-box">


<form id="registerForm">





<div class="input-group">


<label>
Full Name
</label>


<input type="text"
id="registerName"
placeholder="Enter your name"
required>


</div>







<div class="input-group">


<label>
Email
</label>


<input type="email"
id="registerEmail"
placeholder="Enter your email"
required>


</div>







<div class="input-group">


<label>
Phone Number
</label>


<input type="tel"
id="registerPhone"
placeholder="Enter phone number"
required>


</div>








<div class="input-group">


<label>
Password
</label>


<input type="password"
id="registerPassword"
placeholder="Create password"
required>


</div>







<div class="input-group">


<label>
Confirm Password
</label>


<input type="password"
id="confirmPassword"
placeholder="Confirm password"
required>


</div>







<button type="submit" class="btn">

Register

</button>



</form>





<p style="text-align:center;margin-top:20px;">


Already have an account?


<a href="login.html">

Login

</a>


</p>




</div>


</section>








<footer>


<h3>
BookEase Online Booking System
</h3>


<p>
© 2026 All Rights Reserved
</p>


</footer>





<script src="js/script.js"></script>


</body>

</html>
